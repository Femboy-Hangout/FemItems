# Custom items (ItemsAdder-style) live in plugins/FemItems/contents/<namespace>/ — see the README.
# Recipes, smelting and mob drops can use them with "item: <namespace>:<id>" (results/drops) or
# "<namespace>:<id>" (ingredients). FemItems builds a resource pack with their textures and sends it to players.
resource-pack:
  # external  - upload plugins/FemItems/resourcepack/femitems-items.zip to a pack host such as
  #             https://mc-packs.net and paste its download link below. Recommended behind a proxy (Velocity):
  #             no port is opened and the backend's address stays private. FemItems downloads the link on
  #             startup, /femitems reload and /femitems pack, and only sends it to players if it is exactly
  #             the current pack; when you add or change items it tells you to upload the new zip.
  # self-host - FemItems serves the pack from its own web server (self-host.port). Only for servers that
  #             players join directly; it exposes this server's address and needs the port opened.
  # off       - build the pack but never send it.
  mode: external
  url: ""
  # true = players who decline the pack are disconnected.
  required: false
  prompt: "&dFemItems custom item textures"
  self-host:
    port: 8163
    # Blank = http://<address the player joined with>:<port>/
    public-url: ""
