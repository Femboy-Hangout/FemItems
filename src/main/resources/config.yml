# Mob drops are additional to the mob's vanilla drops.
# entity: Bukkit EntityType, or ANY to match any base entity type.
# entity-tag: required scoreboard tag that uniquely identifies this custom mob.
# name-contains: case-insensitive custom name substring; set to "" to ignore the name
# only when entity is a specific type.
mobs:
  archer:
    entity: SKELETON
    entity-tag: "forsaken.archer"
    name-contains: "Archer"
    drops:
      - { material: ARROW, min: 4, max: 8, chance: 0.90 }
      - { material: BONE, min: 2, max: 4, chance: 0.60 }
      - { material: STRING, min: 1, max: 3, chance: 0.35 }
      - { material: BOW, min: 1, max: 1, chance: 0.08 }
  grunt:
    entity: ZOMBIE
    entity-tag: "forsaken.grunt"
    name-contains: "Grunt"
    drops:
      - { material: ROTTEN_FLESH, min: 2, max: 5, chance: 0.90 }
      - { material: IRON_NUGGET, min: 2, max: 4, chance: 0.55 }
      - { material: COAL, min: 1, max: 3, chance: 0.30 }
      - { material: EMERALD, min: 1, max: 2, chance: 0.18 }
      - { material: IRON_SWORD, min: 1, max: 1, chance: 0.05 }
  champion:
    entity: ANY
    entity-tag: "forsaken.champion"
    name-contains: "Champion"
    drops:
      - { material: GOLD_INGOT, min: 5, max: 8, chance: 1.0 }
      - { material: DIAMOND, min: 2, max: 4, chance: 0.75 }
      - { material: EMERALD, min: 4, max: 8, chance: 0.65 }
      - { material: ENCHANTED_BOOK, min: 1, max: 1, chance: 0.20, random-enchantment: true }
      - { material: DIAMOND_SWORD, min: 1, max: 1, chance: 0.15 }
      - { material: NETHERITE_SCRAP, min: 1, max: 1, chance: 0.15 }
      - { material: ECHO_SHARD, min: 1, max: 1, chance: 0.10, name: "&6&lChampion's Trophy" }
  dreadbound:
    entity: HUSK
    entity-tag: "forsaken.dreadbound"
    name-contains: "Dreadbound"
    drops:
      - { material: GOLD_INGOT, min: 2, max: 4, chance: 0.65 }
      - { material: EMERALD, min: 2, max: 4, chance: 0.50 }
      - { material: IRON_INGOT, min: 3, max: 5, chance: 0.60 }
      - { material: ENCHANTED_BOOK, min: 1, max: 1, chance: 0.20, random-enchantment: true }
      - { material: IRON_SWORD, min: 1, max: 1, chance: 0.08 }
      - { material: DIAMOND, min: 1, max: 1, chance: 0.15 }
      - { material: NETHERITE_SCRAP, min: 1, max: 1, chance: 0.05 }
  ravager:
    entity: VINDICATOR
    entity-tag: "forsaken.ravager"
    name-contains: "Ravager"
    drops:
      - { material: EMERALD, min: 2, max: 4, chance: 0.60 }
      - { material: IRON_INGOT, min: 2, max: 4, chance: 0.55 }
      - { material: LEATHER, min: 2, max: 4, chance: 0.40 }
      - { material: DIAMOND, min: 1, max: 1, chance: 0.18 }
      - { material: ENCHANTED_BOOK, min: 1, max: 1, chance: 0.15, random-enchantment: true }
      - { material: IRON_AXE, min: 1, max: 1, chance: 0.08 }

# These examples use shaped recipes, ordinary materials, and item metadata.
