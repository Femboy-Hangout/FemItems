# Mob drops are additional to the mob's vanilla drops.
# entity: Bukkit EntityType, or ANY to match any base entity type.
# name-contains: case-insensitive custom name substring; set to "" to ignore the name
# only when entity is a specific type. ANY requires a non-empty name filter.
mobs:
  archer:
    entity: SKELETON
    name-contains: "Archer"
    drops:
      - { material: ARROW, min: 2, max: 5, chance: 0.75 }
      - { material: BONE, min: 1, max: 3, chance: 0.45 }
      - { material: STRING, min: 1, max: 2, chance: 0.20 }
      - { material: BOW, min: 1, max: 1, chance: 0.05 }
  grunt:
    entity: ZOMBIE
    name-contains: "Grunt"
    drops:
      - { material: ROTTEN_FLESH, min: 2, max: 4, chance: 0.80 }
      - { material: IRON_NUGGET, min: 1, max: 3, chance: 0.35 }
      - { material: COAL, min: 1, max: 2, chance: 0.15 }
      - { material: IRON_SWORD, min: 1, max: 1, chance: 0.03 }
  champion:
    entity: ANY
    name-contains: "Champion"
    drops:
      - { material: GOLD_INGOT, min: 3, max: 6, chance: 1.0 }
      - { material: DIAMOND, min: 1, max: 3, chance: 0.65 }
      - { material: EMERALD, min: 3, max: 6, chance: 0.50 }
      - { material: BOOK, min: 1, max: 1, chance: 0.25 }
      - { material: DIAMOND_SWORD, min: 1, max: 1, chance: 0.15 }
      - { material: NETHERITE_SCRAP, min: 1, max: 1, chance: 0.10 }
      - { material: ECHO_SHARD, min: 1, max: 1, chance: 0.05, name: "&6&lChampion's Trophy" }
  dreadbound:
    entity: ANY
    name-contains: "Dreadbound"
    drops:
      - { material: GOLD_INGOT, min: 1, max: 3, chance: 0.60 }
      - { material: EMERALD, min: 1, max: 3, chance: 0.40 }
      - { material: IRON_INGOT, min: 2, max: 4, chance: 0.35 }
      - { material: ENCHANTED_BOOK, min: 1, max: 1, chance: 0.10, random-enchantment: true }
      - { material: IRON_SWORD, min: 1, max: 1, chance: 0.05 }
      - { material: DIAMOND, min: 1, max: 1, chance: 0.03 }
  ravager:
    entity: ANY
    name-contains: "Ravager"
    drops:
      - { material: EMERALD, min: 1, max: 2, chance: 0.35 }
      - { material: IRON_INGOT, min: 1, max: 2, chance: 0.30 }
      - { material: LEATHER, min: 1, max: 3, chance: 0.25 }
      - { material: IRON_AXE, min: 1, max: 1, chance: 0.05 }

# These examples use shaped recipes, ordinary materials, and item metadata.
recipes:
  soulpiercer_bow:
    type: shaped
    shape:
      - "ETS"
      - "TBT"
      - "STE"
    ingredients:
      E: ECHO_SHARD
      T: STRING
      S: STICK
      B: BOW
    result:
      material: BOW
      amount: 1
      name: "&5Soulpiercer Bow"
      lore:
        - "A bow attuned to lost souls."
      enchants:
        power: 2

  emberblade:
    type: shaped
    shape:
      - "BM"
      - "S "
    ingredients:
      B: BLAZE_POWDER
      M: MAGMA_CREAM
      S: IRON_SWORD
    result:
      material: IRON_SWORD
      name: "&6Emberblade"
      lore:
        - "A blade warmed by the Nether."
      enchants:
        fire_aspect: 1

  warlords_axe:
    type: shaped
    shape:
      - "GIG"
      - "DAD"
      - " I "
    ingredients:
      G: GOLD_INGOT
      I: IRON_INGOT
      D: DIAMOND
      A: DIAMOND_AXE
    result:
      material: DIAMOND_AXE
      name: "&4Warlord's Axe"
      lore:
        - "A finely reinforced battle axe."
      enchants:
        sharpness: 2
        unbreaking: 1

  aegis_shield:
    type: shaped
    shape:
      - "AAI"
      - " S "
    ingredients:
      A: AMETHYST_SHARD
      I: IRON_BLOCK
      S: SHIELD
    result:
      material: SHIELD
      name: "&bAegis Shield"
      lore:
        - "Reinforced to endure repeated blows."
      enchants:
        unbreaking: 2

  prospectors_pick:
    type: shaped
    shape:
      - "GAG"
      - " P "
    ingredients:
      G: GOLD_INGOT
      A: AMETHYST_SHARD
      P: DIAMOND_PICKAXE
    result:
      material: DIAMOND_PICKAXE
      name: "&eProspector's Pick"
      lore:
        - "A precise tool for careful mining."
      enchants:
        efficiency: 2

  cloudstep_boots:
    type: shaped
    shape:
      - "FFM"
      - " B "
    ingredients:
      F: FEATHER
      M: PHANTOM_MEMBRANE
      B: IRON_BOOTS
    result:
      material: IRON_BOOTS
      name: "&fCloudstep Boots"
      lore:
        - "Made for a lighter landing."
      enchants:
        feather_falling: 2

  wayfarers_saddle:
    type: shaped
    shape:
      - "LLL"
      - "ISI"
      - "L L"
    ingredients:
      L: LEATHER
      I: IRON_INGOT
      S: STRING
    result:
      material: SADDLE
      name: "&2Wayfarer's Saddle"
      lore:
        - "A sturdy saddle for long journeys."

  heartwood_bow:
    type: shaped
    shape:
      - "GTG"
      - "TB "
    ingredients:
      G: GOLD_INGOT
      T: STRING
      B: BOW
    result:
      material: BOW
      name: "&aHeartwood Bow"
      lore:
        - "Balanced for steady shots."
      enchants:
        power: 1
        unbreaking: 1
