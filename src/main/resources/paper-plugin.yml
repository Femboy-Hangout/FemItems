name: FemItems
version: '${project.version}'
main: dev.femitems.plugin.FemItemsPlugin
api-version: '26.3'
folia-supported: true
authors: [FemItems]
description: Custom items with resource-pack textures, reloadable mob drops and recipes, and NBS jukebox music for Paper and Folia.
permissions:
  femitems.reload:
    description: Allows /femitems (info), /femitems reload, /femitems debug, /femitems items, and /femitems browse (view only without femitems.give).
    default: op
  femitems.give:
    description: Allows /femitems give <player> <item> [amount] for custom items.
    default: op
  femjukebox.admin:
    description: Allows /femjukebox give, disc, map, reload, and the admin-only Custom discs GUI page.
    default: op
